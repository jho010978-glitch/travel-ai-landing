<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>취향여행 AI 시안</title>
<style>
:root{--bg:#f9fbfd;--ink:#1f2a27;--muted:#5f6b67;--brand:#0b7d63;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
main{max-width:720px;margin:0 auto;padding:72px max(20px,env(safe-area-inset-left,0px)) 80px}
h1{font-size:32px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 32px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
a.c{display:block;background:var(--card);border-radius:16px;box-shadow:0 1px 24px rgba(0,0,0,.08);padding:24px;text-decoration:none;color:inherit}
a.c:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
a.c b{display:block;font-size:20px;margin-bottom:6px}
a.c span{color:var(--muted);font-size:14px;line-height:1.6}
a.c em{display:inline-block;margin-top:14px;font-style:normal;font-weight:700;color:var(--brand)}
small{display:block;margin-top:32px;color:var(--muted)}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>취향여행 AI 랜딩 시안</h1>
  <p>좋았던 여행을 입력하면 리뷰를 종합해 숙소·음식점·교통·치안을 추천하는 여행 AI의 소개 페이지 시안 두 가지입니다.</p>
  <div class="grid">
    <a class="c" href="a/"><b>시안 A</b><span>직접 설계한 판 · 한 화면에 핵심을 모은 구성</span><em>열기 →</em></a>
    <a class="c" href="b/"><b>시안 B</b><span>여행 앱 랜딩 레퍼런스 구조를 따른 판 · 사진 · 기능 섹션 6개</span><em>열기 →</em></a>
  </div>
  <small>YOUTH AI · 서비스 이름은 가칭입니다 · 사진: Unsplash</small>
</main>
</body>
</html>
